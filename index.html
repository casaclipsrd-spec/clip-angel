<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Ángel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8b8b8;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .box {
      background: #18181b;
      border: 1px solid #303038;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #27272a;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #ff2d55;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff2d55, #ff0050);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .options {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .option {
      background: #27272a;
      border-radius: 12px;
      padding: 15px;
      color: #ddd;
    }

    #mensaje {
      margin-top: 20px;
      color: #bbb;
      display: none;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 32px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🎬 Clip Ángel</div>

    <div class="subtitle">
      Convierte tus videos en clips verticales
    </div>

    <div class="box">

      <input
        type="text"
        id="youtubeUrl"
        placeholder="Pega aquí el enlace de YouTube"
      >

      <button onclick="crearClips()">
        ✂️ CREAR CLIPS
      </button>

      <div id="mensaje">
        🔎 Analizando el enlace...
      </div>

      <div class="options">
        <div class="option">📱 Formato 9:16</div>
        <div class="option">📝 Subtítulos</div>
        <div class="option">🔥 Mejores momentos</div>
        <div class="option">🎵 TikTok / Facebook</div>
      </div>

    </div>

  </div>

  <script>
    function crearClips() {

      const url = document.getElementById("youtubeUrl").value;
      const mensaje = document.getElementById("mensaje");

      if (url.trim() === "") {
        alert("Pega primero un enlace de YouTube.");
        return;
      }

      mensaje.style.display = "block";
      mensaje.innerHTML = "🔎 Enlace recibido. Próximamente analizaremos el video...";
    }
  </script>

</body>
</html>
