<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clip Ángel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #b8b8b8;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .box {
      background: #18181b;
      border: 1px solid #303038;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.5);
    }

    input {
      width: 100%;
      padding: 17px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #27272a;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #ff2d55;
    }

    button {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff2d55, #ff0050);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .options {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .option {
      background: #27272a;
      border-radius: 12px;
      padding: 15px;
      color: #ddd;
    }

    #mensaje {
      margin-top: 20px;
      color: #bbb;
      display: none;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 32px;
      }

      .options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<h2>SUBIR MI VIDEO</h2>
<input type="file" id="videoFile" accept=".mp4,.mov,.mkv">
<button onclick="subirVideo()">SUBIR VIDEO</button>
<p id="uploadMensaje"></p>
  <div class="container">

    <div class="logo">🎬 Clip Ángel</div>

    <div class="subtitle">
      Convierte tus videos en clips verticales
    </div>

    <div class="box">

      <input
        type="text"
        id="youtubeUrl"
        placeholder="Pega aquí el enlace de YouTube"
      >

      <button onclick="crearClips()">
        ✂️ CREAR CLIPS
      </button>

      <div id="mensaje">
        🔎 Analizando el enlace...
      </div>

      <div class="options">
        <div class="option">📱 Formato 9:16</div>
        <div class="option">📝 Subtítulos</div>
        <div class="option">🔥 Mejores momentos</div>
        <div class="option">🎵 TikTok / Facebook</div>
      </div>

    </div>

  </div>
<h2>MIS CLIPS</h2>

<button onclick="mostrarClips()">VER MIS CLIPS</button>

<div id="listaClips"></div>
  <script>
  async function crearClips() {

  const url = document.getElementById("youtubeUrl").value;
  const mensaje = document.getElementById("mensaje");

  if (url.trim() === "") {
    alert("Pega primero un enlace de YouTube.");
    return;
  }

  mensaje.style.display = "block";
  mensaje.innerHTML = "🔄 Conectando con Clip Ángel...";

  try {
    const respuesta = await fetch("http://127.0.0.1:8000/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ url: url })
    });

    const resultado = await respuesta.json();

    mensaje.innerHTML = resultado.message || resultado.error || "Respuesta recibida.";

  } catch (error) {
    mensaje.innerHTML = "❌ No se pudo conectar con el servidor.";
  }
}
   async function subirVideo() {
  const archivo = document.getElementById("videoFile").files[0];
  const mensaje = document.getElementById("uploadMensaje");

  if (!archivo) {
    alert("Selecciona primero un video.");
    return;
  }

  const formData = new FormData();
  formData.append("file", archivo);

  mensaje.innerHTML = "Subiendo video...";

  try {
    const respuesta = await fetch(
      "http://127.0.0.1:8000/upload",
      {
        method: "POST",
        body: formData
      }
    );

    const resultado = await respuesta.json();

    if (resultado.error) {
      mensaje.innerHTML = resultado.error;
      return;
    }

    mensaje.innerHTML = "Video subido. Creando clips...";

    const crear = await fetch(
      "http://127.0.0.1:8000/create-clips",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          filename: resultado.filename
        })
      }
    );

    const clips = await crear.json();

    if (clips.error) {
      mensaje.innerHTML = clips.error;
      return;
    }

    mensaje.innerHTML = "Clips creados correctamente.";

  } catch (error) {
    mensaje.innerHTML = "No se pudo completar el proceso.";
  }
}
   async function mostrarClips() {
  const lista = document.getElementById("listaClips");

  lista.innerHTML = "Cargando clips...";

  try {
    const respuesta = await fetch(
      "http://127.0.0.1:8000/clips?t=" + Date.now()
    );

    const datos = await respuesta.json();

    lista.innerHTML = "";

    if (!datos.clips || datos.clips.length === 0) {
      lista.textContent = "Todavía no hay clips.";
      return;
    }

    const nombre = datos.clips[0];

    const enlace = document.createElement("a");
    enlace.href =
      "http://127.0.0.1:8000/download/" +
      encodeURIComponent(nombre);

    enlace.textContent = "Descargar último clip";
    enlace.download = nombre;
    enlace.style.display = "block";

    lista.appendChild(enlace);

  } catch (error) {
    lista.textContent = "No se pudieron cargar los clips.";
  }
}
  </script>

</body>
</html>
